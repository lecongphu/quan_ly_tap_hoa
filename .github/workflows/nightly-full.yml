name: Nightly Full CI

on:
  schedule:
    # 01:30 UTC mỗi ngày
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-full:
    name: Flutter Full (quality + coverage + builds)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Build Web release
        run: flutter build web --release

      - name: Build APK debug (smoke)
        run: flutter build apk --debug

      - name: Dependency report
        run: flutter pub outdated

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  web-full:
    name: Web Full (build + test + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Security audit
        run: npm audit --audit-level=high
